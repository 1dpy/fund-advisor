name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          # 显式锁 Node 24 (GitHub 2025-09 弃用 20, 自动强升会改变 V8 行为, 易诱发隐藏差异)
          node-version: '24'

      - name: 语法检查 (所有 JS 文件)
        run: |
          fail=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f" || { echo "❌ 语法错误: $f"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "✅ 全部 JS 语法通过"
          exit $fail

      - name: 准备示例持仓
        run: cp holdings.example.json holdings.json

      - name: 安装依赖
        run: npm install

      - name: 模块加载 + 离线冒烟测试
        run: node --trace-warnings test/smoke.js > /tmp/smoke.log 2>&1

      - name: 离线量化校验 (因子库 / walk-forward / 敏感性 / EWMA)
        run: node --trace-warnings test/offline_quant.js > /tmp/offline.log 2>&1

      - name: 多策略回测 + 生成 HTML 报告 (联网抓取, 允许失败)
        continue-on-error: true
        run: |
          node backtest_model_compare.js 2>&1 | tail -25 || true

      - name: 量化实验室回测报告 (合成数据兜底, 离线可跑)
        continue-on-error: true
        run: node backtest_quant_lab.js --demo

      - name: 自我迭代验证 + 更长数据测试集 (合成数据兜底, 离线可跑)
        continue-on-error: true
        run: node backtest_self_iterate.js --demo

      - name: 仪表盘模块加载 + 离线数据 API (合成数据, 不启动监听)
        continue-on-error: true
        run: node test/dashboard_load.js

      - name: 持续自我迭代 (实时+历史, 离线合成跑通)
        continue-on-error: true
        run: node src/continual_self_iterate.js

      - name: 上传回测报告 (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/*.html
          if-no-files-found: ignore

      - name: 失败诊断：汇总日志并发 Issue (供 AI 读取)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## CI 失败诊断 @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- node: $(node -v) | npm: $(npm -v) | os: $(uname -a)"
            echo ""
            echo "### 语法检查"
            fail=0; for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f" 2>&1 || { echo "ERR: $f"; fail=1; }; done; [ $fail -eq 0 ] && echo "语法全过"
            echo ""
            echo '```'
            echo "===== smoke.log ====="; cat /tmp/smoke.log 2>/dev/null
            echo "===== offline.log ====="; cat /tmp/offline.log 2>/dev/null
            echo '```'
          } > /tmp/diag.md
          gh issue create --title "CI 失败诊断 $(date -u +%Y%m%dT%H%M%SZ)" --body-file /tmp/diag.md || echo "(issue 创建失败，忽略)"
