name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 语法检查 (所有 JS 文件)
        run: |
          fail=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f" || { echo "❌ 语法错误: $f"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "✅ 全部 JS 语法通过"
          exit $fail

      - name: 准备示例持仓
        run: cp holdings.example.json holdings.json

      - name: 安装依赖
        run: npm install

      - name: 模块加载 + 离线冒烟测试
        run: node test/smoke.js

      - name: 离线量化校验 (因子库 / walk-forward / 敏感性 / EWMA)
        run: node test/offline_quant.js

      - name: 多策略回测 + 生成 HTML 报告 (联网抓取, 允许失败)
        continue-on-error: true
        run: |
          node backtest_model_compare.js 2>&1 | tail -25 || true

      - name: 量化实验室回测报告 (合成数据兜底, 离线可跑)
        continue-on-error: true
        run: node backtest_quant_lab.js --demo

      - name: 自我迭代验证 + 更长数据测试集 (合成数据兜底, 离线可跑)
        continue-on-error: true
        run: node backtest_self_iterate.js --demo

      - name: 仪表盘模块加载 + 离线数据 API (合成数据, 不启动监听)
        continue-on-error: true
        run: node -e "const s=require('./dashboard_server');Promise.all([s.portfolioData(),s.factorsData('demo'),s.backtestData('demo'),s.selfIterateData('demo'),s.sectorsData('demo')]).then(d=>console.log('✅ 仪表盘数据 API 可用: 因子'+d[1].universe.length+' 策略'+d[2].strategies.length+' 折'+(d[3].folds?d[3].folds.length:'-')+' 实时赛道Top'+d[4].top.length+'/候选'+d[4].total)).catch(e=>{console.error('❌',e);process.exit(1)})"

      - name: 持续自我迭代 (实时+历史, 离线合成跑通)
        continue-on-error: true
        run: node src/continual_self_iterate.js

      - name: 上传回测报告 (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/*.html
          if-no-files-found: ignore
