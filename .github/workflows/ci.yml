name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          # 显式锁 Node 24 (GitHub 2025-09 弃用 20, 自动强升会改变 V8 行为, 易诱发隐藏差异)
          node-version: '24'

      - name: 语法检查 (所有 JS 文件)
        run: |
          fail=0
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$f" || { echo "❌ 语法错误: $f"; fail=1; }
          done
          [ $fail -eq 0 ] && echo "✅ 全部 JS 语法通过"
          exit $fail

      - name: 准备示例持仓
        run: cp holdings.example.json holdings.json

      - name: 安装依赖
        run: npm install

      - name: 模块加载 + 离线冒烟测试
        run: node --trace-warnings test/smoke.js 2>&1 | tee /tmp/smoke.log

      - name: 离线量化校验 (因子库 / walk-forward / 敏感性 / EWMA)
        run: node --trace-warnings test/offline_quant.js 2>&1 | tee /tmp/offline.log

      - name: 风险指标库单测 (索提诺/MDD/凯利/IR/VaR/CVaR)
        run: node --trace-warnings test/risk_metrics.test.js 2>&1 | tee /tmp/risk.log

      - name: 策略模块单测 (TM/HM择时·美林时钟·定投·网格·风格回归)
        run: node --trace-warnings test/strategy_modules.test.js 2>&1 | tee /tmp/strategy.log

      - name: 策略核心单测 (选基/仓位/止盈止损/费率/交易日闸门)
        run: node --trace-warnings test/strategy_selection.test.js 2>&1 | tee /tmp/selection.log

      - name: V6 激进引擎单测 (动量/ATR/止损止盈/轮动/金字塔/现金预算)
        run: node --trace-warnings test/strategy_aggressive.test.js 2>&1 | tee /tmp/aggressive.log

      - name: V4 默认引擎单测 (止损/止盈/现金预算/SWAP指令一致性)
        run: node --trace-warnings test/advisor_v4.test.js 2>&1 | tee /tmp/v4.log

      - name: 交易日历 + 赎回费单测 (含跨年 tripwire)
        run: node --trace-warnings test/t1_calendar.test.js 2>&1 | tee /tmp/calendar.log

      - name: 持仓回写单测 (applyDecisions: 加仓合并/成本结转/NaN防护)
        run: node --trace-warnings test/apply_decisions.test.js 2>&1 | tee /tmp/apply.log

      - name: 决策可复现性测试 (同数据两次运行必须同结论)
        run: node --trace-warnings test/reproducibility.test.js 2>&1 | tee /tmp/repro.log

      - name: 决策引擎属性测试 (600组随机组合 × V5/V6 × 不变量)
        run: node --trace-warnings test/decision_fuzz.test.js 2>&1 | tee /tmp/fuzz.log

      - name: V4 默认引擎属性测试 (60组随机组合 × 8项不变量)
        run: node --trace-warnings test/decision_fuzz_v4.test.js 2>&1 | tee /tmp/fuzz_v4.log

      - name: 组合账本单测 (现金口径 / 盈亏 fallback / 自适应止损 / 峰值 / 冷却期)
        run: node --trace-warnings test/portfolio_book.test.js 2>&1 | tee /tmp/book.log

      - name: ML 开关单测 (enable* 生效 / 关模型后权重归一化)
        run: node --trace-warnings test/ml_config_flags.test.js 2>&1 | tee /tmp/mlconfig.log

      - name: 数据新鲜度单测 (按交易日计龄 / 三档判定 / 决策侧排除)
        run: node --trace-warnings test/data_freshness.test.js 2>&1 | tee /tmp/freshness.log

      - name: V5/V6 回写单测 (apply_advice: 市值/成本/份额三者同步)
        run: node --trace-warnings test/apply_advice.test.js 2>&1 | tee /tmp/apply_v5.log

      - name: 多策略回测 + 生成 HTML 报告 (联网抓取, 允许失败)
        continue-on-error: true
        run: |
          node backtest_model_compare.js 2>&1 | tail -25 || true

      - name: 量化实验室回测报告 (合成数据兜底, 离线可跑)
        continue-on-error: true
        run: node backtest_quant_lab.js --demo

      - name: 自我迭代验证 + 更长数据测试集 (合成数据兜底, 离线可跑)
        continue-on-error: true
        run: node backtest_self_iterate.js --demo

      - name: 仪表盘模块加载 + 离线数据 API (合成数据, 不启动监听)
        continue-on-error: true
        run: node test/dashboard_load.js

      - name: 持续自我迭代 (实时+历史, 离线合成跑通)
        continue-on-error: true
        run: node src/continual_self_iterate.js

      - name: 上传回测报告 (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: reports/*.html
          if-no-files-found: ignore

      - name: 失败诊断：汇总日志并发 Issue (供 AI 读取)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "## CI 失败诊断 @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- node: $(node -v) | npm: $(npm -v) | os: $(uname -a)"
            echo ""
            echo "### 语法检查"
            fail=0; for f in $(find . -name '*.js' -not -path './node_modules/*'); do node --check "$f" 2>&1 || { echo "ERR: $f"; fail=1; }; done; [ $fail -eq 0 ] && echo "语法全过"
            echo ""
            echo '```'
            echo "===== smoke.log ====="; cat /tmp/smoke.log 2>/dev/null || echo "(无 smoke.log)"
            echo "===== offline.log ====="; cat /tmp/offline.log 2>/dev/null || echo "(无 offline.log)"
            echo "===== risk.log ====="; cat /tmp/risk.log 2>/dev/null || echo "(无 risk.log)"
            echo "===== strategy.log ====="; cat /tmp/strategy.log 2>/dev/null || echo "(无 strategy.log)"
            echo "===== selection.log ====="; cat /tmp/selection.log 2>/dev/null || echo "(无 selection.log)"
            echo "===== aggressive.log ====="; cat /tmp/aggressive.log 2>/dev/null || echo "(无 aggressive.log)"
            echo "===== v4.log ====="; cat /tmp/v4.log 2>/dev/null || echo "(无 v4.log)"
            echo "===== calendar.log ====="; cat /tmp/calendar.log 2>/dev/null || echo "(无 calendar.log)"
            echo "===== apply.log ====="; cat /tmp/apply.log 2>/dev/null || echo "(无 apply.log)"
            echo "===== repro.log ====="; cat /tmp/repro.log 2>/dev/null || echo "(无 repro.log)"
            echo "===== fuzz.log ====="; cat /tmp/fuzz.log 2>/dev/null || echo "(无 fuzz.log)"
            echo "===== fuzz_v4.log ====="; cat /tmp/fuzz_v4.log 2>/dev/null || echo "(无 fuzz_v4.log)"
            echo "===== book.log ====="; cat /tmp/book.log 2>/dev/null || echo "(无 book.log)"
            echo "===== mlconfig.log ====="; cat /tmp/mlconfig.log 2>/dev/null || echo "(无 mlconfig.log)"
            echo "===== freshness.log ====="; cat /tmp/freshness.log 2>/dev/null || echo "(无 freshness.log)"
            echo "===== apply_v5.log ====="; cat /tmp/apply_v5.log 2>/dev/null || echo "(无 apply_v5.log)"
            echo '```'
          } > /tmp/diag.md
          gh issue create --title "CI 失败诊断 $(date -u +%Y%m%dT%H%M%SZ)" --body-file /tmp/diag.md || echo "(issue 创建失败，忽略)"
